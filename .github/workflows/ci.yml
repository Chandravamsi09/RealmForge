name: RealmForge CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck all workspaces
        run: npm run typecheck

  test-suites:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: realmforge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/realmforge_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_test_secret_for_realmforge_jwt_12345
        run: npm run test:integration

  docker-build:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-suites]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: false
          tags: realmforge-server:latest

      - name: Build Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.client
          push: false
          tags: realmforge-client:latest
