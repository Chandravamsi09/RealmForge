name: RealmForge CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Typecheck & Build Shared Engine Core
        run: npm run build --workspace=shared

      - name: Typecheck & Build Server Microservices
        run: npm run build --workspace=server

      - name: Typecheck & Build Client Frontend (Vite + Phaser)
        run: npm run build --workspace=client

      - name: Run Test Suite (Unit & Integration Tests)
        run: npm test

      - name: Check Code Linting
        run: npm run lint --if-present
